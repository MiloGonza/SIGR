
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    :root {
      --background: #F5EBD8;
      --foreground: #263D32;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #263D32;
        --foreground: #F5EBD8;
      }
    }
  </style>

  <!-- Moss-green background -->
  <rect width="512" height="512" fill="#78866B" rx="100" />

  <!-- Decorative accent -->
  <circle cx="256" cy="256" r="166"
          fill="none" stroke="#D99A56"
          stroke-width="3" opacity=".35"/>

  <!-- Plate -->
  <circle cx="256" cy="278" r="111"
      fill="var(--foreground)"/>
  <circle cx="256" cy="278" r="88"
          fill="none" stroke="#263D32" stroke-width="5"/>
  <circle cx="256" cy="278" r="70"
          fill="#E9A05E"/>

  <!-- Food symbol -->
  <path d="M220 278
           C220 256 239 240 256 240
           C273 240 292 256 292 278
           C292 300 273 316 256 316
           C239 316 220 300 220 278Z"
        fill="var(--foreground)"/>

  <path d="M245 266 Q256 253 267 266"
        fill="none" stroke="#E9A05E"
        stroke-width="5" stroke-linecap="round"/>

  <!-- Steam -->
  <g fill="none" stroke="var(--foreground)"
     stroke-width="9" stroke-linecap="round">
    <path d="M226 144 Q209 125 226 106"/>
    <path d="M256 135 Q239 113 256 88"/>
    <path d="M286 144 Q303 125 286 106"/>
  </g>

  <!-- Fork -->
  <g fill="none" stroke="var(--foreground)"
     stroke-width="9" stroke-linecap="round">
    <path d="M112 207 V252"/>
    <path d="M96 207 V229"/>
    <path d="M128 207 V229"/>
    <path d="M96 229 Q96 252 112 252"/>
    <path d="M128 229 Q128 252 112 252"/>
    <path d="M112 252 V360"/>
  </g>

  <!-- Knife -->
  <path d="M389 205
           C411 243 411 273 389 290
           L389 360"
        fill="none" stroke="var(--foreground)"
        stroke-width="11" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Small orange accent -->
  <circle cx="370" cy="116" r="9" fill="#E9A05E"/>
</svg>
